[project]
name = "stock-screener-v3"
version = "0.1.0"
description = "V3 rebuild of the stock screener engine with explicit contracts and backtesting-first validation."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "yfinance>=0.2",
]

[project.scripts]
stock-screener-v3 = "stock_screener_v3.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
